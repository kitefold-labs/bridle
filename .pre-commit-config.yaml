# Install once: `pip install pre-commit && pre-commit install --hook-type pre-commit --hook-type pre-push`
# See docs/development.md.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.bat$
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
        args: [--maxkb=512]
      # Test fixtures that intentionally contain throwaway keys live under testdata/.
      - id: detect-private-key
        exclude: (^|/)testdata/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=style, --shell=sh]
        types: [sh]
      - id: shellcheck
        name: shellcheck (bash)
        args: [--severity=style, --shell=bash]
        types: [bash]

  - repo: local
    hooks:
      - id: test-bodies
        name: tests must return Unit (JUnit skips non-void tests)
        entry: python3 scripts/check_test_bodies.py
        language: system
        files: /src/(test|androidTest)/.*\.kt$
      - id: ktlint
        name: ktlint (Gradle)
        entry: ./gradlew ktlintCheck --quiet
        language: system
        files: \.kts?$
        pass_filenames: false
      - id: gradle-check
        name: tests + detekt + 95% coverage gate (Gradle)
        entry: ./gradlew check koverVerifyBridle --quiet
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
