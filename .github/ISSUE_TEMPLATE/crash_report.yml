name: Crash report
description: Bridle crashed (the in-app reporter fills this in for you)
labels: [crash]
body:
  - type: markdown
    attributes:
      value: Reports generated by Bridle contain no hostnames, usernames, file paths or terminal content. Please check before submitting.
  - type: textarea
    id: context
    attributes:
      label: What were you doing?
  - type: textarea
    id: report
    attributes:
      label: Crash report
      render: text
    validations:
      required: true
