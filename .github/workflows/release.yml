name: Release

# Builds the release APK and AAB for a version tag and attaches them, with SHA-256 checksums, to
# a draft GitHub Release. Signing is skipped (unsigned artifacts) unless the repository has the
# BRIDLE_SIGNING_* secrets; see docs/release.md. Publishing the draft is a manual step.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true # release builds start clean
      - name: Install tmux (integration tests drive a real tmux server)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Full gate (tests, lint, >=95% coverage, licenses)
        run: |
          ./gradlew check koverVerifyBridle --stacktrace
          ./gradlew checkLicense --no-configuration-cache --no-parallel --stacktrace
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.BRIDLE_SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BRIDLE_SIGNING_STOREFILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets; building unsigned artifacts."
          fi
      - name: Build APK and AAB
        env:
          BRIDLE_SIGNING_STOREPASSWORD: ${{ secrets.BRIDLE_SIGNING_STOREPASSWORD }}
          BRIDLE_SIGNING_KEYALIAS: ${{ secrets.BRIDLE_SIGNING_KEYALIAS }}
          BRIDLE_SIGNING_KEYPASSWORD: ${{ secrets.BRIDLE_SIGNING_KEYPASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-build-cache --stacktrace
      - name: Collect artifacts and checksums
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/*.apk dist/
          cp app/build/outputs/bundle/release/*.aab dist/
          rm -f "$RUNNER_TEMP/release.jks"
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Bridle $TAG" --generate-notes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          retention-days: 30
          path: dist/
