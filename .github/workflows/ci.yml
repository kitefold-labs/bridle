name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR builds are cancelled; every push to main still gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pre-commit==4.3.0
      # Gradle-backed hooks run in the build job instead (with caching).
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ktlint,gradle-check

  build:
    name: Build, test, coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Install tmux (integration tests drive a real tmux server)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Build, lint, test, verify >=95% coverage
        run: ./gradlew check koverVerifyBridle koverXmlReportBridle koverHtmlReportBridle --stacktrace
      # The license-report plugin resolves every project's classpath from a root task, which
      # Gradle 9 only allows without parallel execution or the configuration cache.
      - name: Check dependency licenses (Apache-2.0 compatible)
        run: ./gradlew checkLicense --no-configuration-cache --no-parallel --stacktrace
      - name: Coverage summary
        if: always()
        run: python3 scripts/coverage_summary.py build/reports/kover/reportBridle.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          retention-days: 14
          path: |
            build/reports/
            **/build/reports/
            **/build/test-results/
