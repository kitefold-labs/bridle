name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR builds are cancelled; every push to main still gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pre-commit==4.3.0
      # Gradle-backed hooks run in the build job instead (with caching).
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ktlint,gradle-check

  build:
    name: Build, test, coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Install tmux (integration tests drive a real tmux server)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Build, lint, test, verify >=95% coverage
        run: ./gradlew check koverVerifyBridle koverXmlReportBridle koverHtmlReportBridle --stacktrace
      # R8 only runs for release builds; catches missing keep/dontwarn rules (e.g. sshj's GSSAPI).
      - name: Assemble release (R8 minify)
        run: ./gradlew :app:assembleRelease --stacktrace
      # The license-report plugin resolves every project's classpath from a root task, which
      # Gradle 9 only allows without parallel execution or the configuration cache.
      - name: Check dependency licenses (Apache-2.0 compatible)
        run: ./gradlew checkLicense --no-configuration-cache --no-parallel --stacktrace
      - name: Coverage summary
        if: always()
        run: python3 scripts/coverage_summary.py build/reports/kover/reportBridle.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          retention-days: 14
          path: |
            build/reports/
            **/build/reports/
            **/build/test-results/
